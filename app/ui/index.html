<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDV</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div>
    <button id="btnStart">Iniciar Venda</button>
    <button id="btnFinish" disabled>Finalizar Venda</button>
  </div>

  <div>
    <label for="productInput">Código do produto</label>
    <input type="text" id="productInput" disabled autocomplete="off" />
  </div>

  <div id="salePanel">
    <h2>Venda atual</h2>
    <p><strong>ID:</strong> <span id="saleId">—</span></p>
    <p><strong>Total:</strong> R$ <span id="saleTotal">0,00</span></p>

    <h3>Itens</h3>
    <ul id="itemsList"></ul>
  </div>


  <script src="scripts/ui.js" defer></script>
</body>
</html>
